# The database `cargo run` talks to, with the login and database `ekbatan.json` defaults to.
# `docker compose up -d` starts it; `docker compose down` removes it. init.sql lets `wallet`
# create the `eventlog` database the first migration makes.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: wallet
      MYSQL_PASSWORD: wallet
      MYSQL_DATABASE: wallet
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - "./init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
