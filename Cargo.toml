[workspace]
resolver = "3"
members = [
    "ekbatan",
    "ekbatan-macros",
    "ekbatan-schemagen",
    "ekbatan-test-support",
    "wallet-example",
    "age-pins",
    "ekbatan-rs-examples/axum-wallet-rest-pg",
    "ekbatan-rs-examples/axum-wallet-rest-mysql",
    "ekbatan-rs-examples/axum-wallet-rest-mariadb",
    "ekbatan-rs-examples/axum-wallet-rest-sharded-pg",
    "ekbatan-rs-examples/axum-wallet-saga-pg",
    "ekbatan-rs-examples/job-worker-pg",
]
# The examples are members (one lock file, so the 2-week pins hold for them too) but not
# default members: `cargo build` / `cargo test` at the root are the framework's. Build an
# example with `-p <name>`.
default-members = [
    "ekbatan",
    "ekbatan-macros",
    "ekbatan-schemagen",
    "ekbatan-test-support",
    "wallet-example",
    "age-pins",
]

# Every version here (and in Cargo.lock) was published at least 14 days before 2026-11-03.
[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = "2.0.119"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
rust_decimal = { version = "1.43.0", features = ["serde-float", "serde-arbitrary-precision"] }
sea-query = { version = "1.0.2", default-features = false, features = [
    "derive",
    "backend-postgres",
    "backend-mysql",
    "thread-safe",
    "postgres-array",
    "with-uuid",
    "with-rust_decimal",
    "with-chrono",
] }
sea-query-sqlx = { version = "0.9.1", features = [
    "sqlx-postgres",
    "postgres-array",
    "sqlx-mysql",
    "with-uuid",
    "with-rust_decimal",
    "with-chrono",
] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "uuid",
    "rust_decimal",
    "chrono",
    "derive",
    "migrate",
] }
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql", "mariadb"] }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "testing"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "ansi", "env-filter"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
