# Builds website/ and publishes it as this repository's GitHub Page, at
#     https://ekbatan-io.github.io/ekbatan-rs/
#
# Its own workflow, not a job in ci.yml: the site is the only part of this repository that needs
# Node. CI skips a push that only changes website/**.
#
# The site is a project page, so it is served from /ekbatan-rs/ rather than the root - hence
# BASE. Astro's `base` and the remark plugin prefix every internal link with it.

name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

# Don't cancel a deploy in flight: a half-deployed site is worse than waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: /ekbatan-rs/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Astro 7 needs Node 22.22 or later.
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json
      # `npm ci`: exactly the lock file, and a failure if package.json drifted from it.
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      # Unknown utility classes against the frozen bundle, and internal links to pages that
      # weren't built.
      - run: npm run check
        working-directory: website
      # Every Learn and Reference page has its docs/ twin.
      - run: python3 website/scripts/check-twins.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
